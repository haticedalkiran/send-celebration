<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gmail Send Celebration</title>
<style>
@font-face { font-family: 'Press Start 2P'; src: url('/fonts/press-start-2p.woff2') format('woff2'); }
:root {
  --bg: #12122a; --panel: #1c1c3d; --line: #3a3a73; --text: #f2f2ff; --muted: #a3a3cc;
  --accent: #ffe600; --pink: #ff2e63; --cyan: #08d9d6; --green: #7cff4f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
h1, h2 { font-family: 'Press Start 2P', monospace; font-weight: 400; text-transform: uppercase; }
h1 { color: var(--accent); font-size: 20px; text-shadow: 3px 3px 0 var(--pink); margin: 0 0 8px; line-height: 1.4; }
h2 { font-size: 12px; color: var(--cyan); margin: 0 0 16px; }
p.lead { color: var(--muted); margin: 0 0 24px; }
section { background: var(--panel); border: 3px solid var(--line); padding: 20px; margin-bottom: 20px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.row:first-of-type { border-top: 0; }
.row label { flex: 1 1 220px; }
.row small { display: block; color: var(--muted); }
select, input[type=number] { background: var(--bg); color: var(--text); border: 2px solid var(--line); padding: 8px; font: inherit; min-width: 120px; }
input[type=number] { width: 90px; min-width: 0; }
input[type=range] { width: 160px; accent-color: var(--accent); }
input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
input:disabled { cursor: not-allowed; }
.row.locked { opacity: .5; }
select:focus-visible, input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.swatches { display: flex; gap: 4px; }
.swatches span { width: 16px; height: 16px; display: inline-block; border: 2px solid var(--bg); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--bg); border: 2px solid var(--line); padding: 12px; }
.stat b { display: block; font: 400 16px/1.5 'Press Start 2P', monospace; color: var(--accent); margin-top: 8px; }
.stat span { color: var(--muted); font-size: 13px; }
#levelMeter { margin-bottom: 20px; }
.meter { height: 14px; background: var(--bg); border: 2px solid var(--line); margin: 8px 0 4px; }
.meter i { display: block; height: 100%; background: var(--green); }
.badges { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.badge { border: 2px solid var(--line); padding: 10px; background: var(--bg); }
.badge.locked { opacity: .5; }
.badge b { font: 400 10px/1.5 'Press Start 2P', monospace; color: var(--accent); display: block; margin-bottom: 4px; }
.badge.locked b { color: var(--muted); }
.badge small { color: var(--muted); }
button { background: var(--pink); color: #fff; border: 0; padding: 10px 16px; font: 600 14px system-ui; cursor: pointer; }
button:hover { filter: brightness(1.1); }
#saved { font: 400 10px 'Press Start 2P', monospace; color: var(--green); opacity: 0; transition: opacity .2s; }
#saved.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #saved { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Send Celebration</h1>
  <p class="lead">Every sent mail is a small win. Tune the show. <span id="saved" role="status">SAVED</span></p>

  <section aria-labelledby="h-stats">
    <h2 id="h-stats">Your stats</h2>
    <div class="stats" id="stats"></div>
    <div id="levelMeter"></div>
    <div class="badges" id="badges"></div>
  </section>

  <section aria-labelledby="h-general">
    <h2 id="h-general">General</h2>
    <div class="row">
      <label for="enabled">Celebrate sent mails<small>Turns the whole extension on or off.</small></label>
      <input type="checkbox" id="enabled" data-key="enabled">
    </div>
    <div class="row">
      <label for="dailyGoal">Daily goal (mails)<small>Reaching it triggers the "Mission complete" finale.</small></label>
      <input type="number" id="dailyGoal" data-key="dailyGoal" min="1" max="200">
    </div>
  </section>

  <section aria-labelledby="h-theme">
    <h2 id="h-theme">Theme</h2>
    <div class="row">
      <label for="theme">Look and feel<small>Random picks a new theme for every send.</small></label>
      <span class="swatches" id="swatches" aria-hidden="true"></span>
      <select id="theme" data-key="theme"></select>
    </div>
  </section>

  <section aria-labelledby="h-sound">
    <h2 id="h-sound">Sound</h2>
    <div class="row">
      <label for="sound">Play sounds</label>
      <input type="checkbox" id="sound" data-key="sound">
    </div>
    <div class="row">
      <label for="volume">Volume</label>
      <input type="range" id="volume" data-key="volume" min="0" max="1" step="0.05">
    </div>
    <div class="row">
      <label for="quietHours">Quiet hours<small>Mute sound (effects still show) during these hours. Turn this on for the hours below to apply.</small><small id="quietStatus" role="status"></small></label>
      <input type="checkbox" id="quietHours" data-key="quietHours">
    </div>
    <div class="row" id="rowQuietStart">
      <label for="quietStart">Quiet from (hour, 0-23)</label>
      <input type="number" id="quietStart" data-key="quietStart" min="0" max="23">
    </div>
    <div class="row" id="rowQuietEnd">
      <label for="quietEnd">Quiet until (hour, 0-23)</label>
      <input type="number" id="quietEnd" data-key="quietEnd" min="0" max="23">
    </div>
  </section>

  <section aria-labelledby="h-data">
    <h2 id="h-data">Data</h2>
    <div class="row">
      <label>Reset score, level and badges<small>Stored only in this browser. This cannot be undone.</small></label>
      <button id="reset" type="button">Reset stats</button>
    </div>
  </section>
</main>
<script>
(() => {
  const stats = { total: 137, score: 18400, bestCombo: 6, combo: 1, lastSendAt: 0, day: '', today: 4, goalDay: '', lastMessage: '',
    badges: { first_send: 1, early_bird: 1, ten_a_day: 1, combo_5: 1, century: 1 } };
  const store = { stats };
  const get = async (k) => (typeof k === 'string' ? { [k]: store[k] } : { ...k });
  window.chrome = { storage: { local: { get, set: async () => {}, remove: async () => {} }, sync: { get, set: async () => {} } } };
})();
</script>
<script src="/dist/options.js"></script>
</body>
</html>
