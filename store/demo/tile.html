<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>tile</title>
<style>
@font-face { font-family: 'Press Start 2P'; src: url('/fonts/press-start-2p.woff2') format('woff2'); }
:root { --u: 0.72; }
* { box-sizing: border-box; margin: 0; }
body { width: 100vw; height: 100vh; overflow: hidden; background: #1a1a2e; position: relative; font-family: 'Press Start 2P', monospace; color: #ffe600; }
body.big { --u: 2; }
.wrap { z-index: 2; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: calc(22px * var(--u)); }
img { width: calc(96px * var(--u)); height: calc(96px * var(--u)); image-rendering: pixelated; }
h1 { font-weight: 400; font-size: calc(22px * var(--u)); line-height: 1.5; text-transform: uppercase; text-shadow: calc(3px * var(--u)) calc(3px * var(--u)) 0 #ff2e63, calc(6px * var(--u)) calc(6px * var(--u)) 0 #0b0b18; }
p { margin-top: calc(14px * var(--u)); font-size: calc(9px * var(--u)); color: #08d9d6; line-height: 1.6; }
i { position: absolute; width: calc(10px * var(--u)); height: calc(10px * var(--u)); }
</style></head>
<body>
<div class="wrap"><img src="/icons/icon128.png" alt=""><div><h1>Send<br>Celebration</h1><p>FOR GMAIL</p></div></div>
<script>
if (new URLSearchParams(location.search).get('big')) document.body.classList.add('big');
const cols = ['#ff2e63', '#08d9d6', '#ffe600', '#7cff4f', '#b967ff'];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let n = 0; n < 46; n++) {
  const el = document.createElement('i');
  el.style.left = rnd() * 96 + '%'; el.style.top = rnd() * 94 + '%';
  el.style.background = cols[Math.floor(rnd() * cols.length)];
  el.style.opacity = 0.55 + rnd() * 0.45;
  document.body.appendChild(el);
}
</script>
</body></html>
